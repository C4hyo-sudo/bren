<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TEMPINO OPS — Field · Finance · HQ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#EEF2F6; --line:#DCE3EA;
  --ink:#1F2937; --ink-dim:#5B6B79; --ink-faint:#8B98A3;
  --steel:#2E75B6; --steel-dim:#1F5D8F;
  --amber:#B9791C; --green:#2F9E5B; --red:#D64545; --purple:#7C5CC7;
  --font-d:"Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",Arial,sans-serif;
  --font-b:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-m:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);-webkit-font-smoothing:antialiased;}
body{min-height:100vh;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:var(--font-b);}

/* ===== Login — bright, photo-realistic oil & gas field scene ===== */
.login-wrap{
  min-height:100vh;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(180deg,#AFD8F2 0%,#CDE9F7 18%,#E9F4F7 38%,#FBEFD3 62%,#F3CE94 82%,#E7B36E 100%);
}
.oil-scene{position:absolute;inset:0;z-index:0;overflow:hidden;}
.oil-sun{position:absolute;left:50%;bottom:38%;transform:translateX(-50%);width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle, #FFF6DE 0%, #FFE8A8 35%, #FBCB6E 65%, rgba(251,203,110,0) 100%);
  box-shadow:0 0 90px 40px rgba(255,214,130,.55);}
.oil-sky-glow{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);width:1200px;height:700px;max-width:170vw;
  background:radial-gradient(ellipse, rgba(250,196,90,.45) 0%, rgba(250,178,110,.18) 40%, rgba(250,178,110,0) 70%);
  filter:blur(6px);}
.oil-cloud{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(6px);}
.oil-haze{position:absolute;left:0;right:0;bottom:0;height:30%;
  background:linear-gradient(180deg, rgba(243,206,148,0) 0%, rgba(224,166,101,.55) 100%);}
.oil-floor{position:absolute;left:0;right:0;bottom:0;height:36%;
  background:linear-gradient(180deg, #D9A972 0%, #C9905C 35%, #B87B49 100%);
  -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,1) 55%, transparent);
  mask-image:linear-gradient(to top, rgba(0,0,0,1) 55%, transparent);
}
.oil-floor::before{content:'';position:absolute;inset:0;opacity:.25;
  background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.15) 0 2px, transparent 2px 40px);
}
.rig{position:absolute;bottom:22%;}
.rig.main{left:50%;transform:translateX(-50%) scale(1.55);z-index:2;filter:drop-shadow(0 14px 22px rgba(80,50,20,.28));}
.rig.side-l{left:4%;bottom:18%;transform:scale(.58);opacity:.55;filter:blur(.3px);}
.rig.side-r{right:3%;bottom:15%;transform:scale(.46);opacity:.42;filter:blur(.5px);}
.rig .struct{stroke:#2B2018;}
.rig .rim{stroke:#FFDFA0;stroke-width:1.4;opacity:.65;}
.rig .flareGlow{animation:flarepulse 1.7s ease-in-out infinite;}
@keyframes flarepulse{0%,100%{opacity:.55;r:12;}50%{opacity:1;r:17;}}
.pump{position:absolute;bottom:7%;opacity:.55;}
.pump.p1{left:15%;transform:scale(.5);animation:pumpjack 3.2s ease-in-out infinite;}
.pump.p2{right:13%;transform:scale(.4) scaleX(-1);animation:pumpjack2 2.6s ease-in-out infinite .4s;}
@keyframes pumpjack{0%,100%{transform:scale(.5) rotate(0deg);}50%{transform:scale(.5) rotate(-8deg);}}
@keyframes pumpjack2{0%,100%{transform:scale(.4) scaleX(-1) rotate(0deg);}50%{transform:scale(.4) scaleX(-1) rotate(8deg);}}
.oil-vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(60,35,15,.18) 100%);}

.login-card{position:relative;z-index:5;width:100%;max-width:380px;margin:0 auto;
  background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(46,117,182,.18);border-radius:14px;padding:28px 26px;
  box-shadow:0 20px 55px rgba(31,41,55,.14), 0 0 0 1px rgba(255,255,255,.4);}
.login-card .brandmark{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:10px;text-align:center;}
.login-card .logo-img{width:96px;height:auto;margin-bottom:4px;}
.login-card h1{font-family:var(--font-d);text-transform:uppercase;letter-spacing:.06em;font-size:22px;margin:0;line-height:1.15;color:var(--ink);}
.login-card .sub{font-size:11px;color:var(--ink-faint);font-family:var(--font-m);margin:4px 0 20px;letter-spacing:.03em;text-align:center;}
.login-card .field{margin-bottom:12px;}
.login-err{background:rgba(214,69,69,.1);border:1px solid rgba(214,69,69,.3);color:#9A2E2E;padding:8px 10px;border-radius:7px;font-size:12px;margin-bottom:12px;}
.login-hint{margin-top:16px;font-size:10.5px;color:var(--ink-faint);font-family:var(--font-m);line-height:1.6;border-top:1px solid var(--line);padding-top:12px;}
.login-hint b{color:var(--amber);}
.mode-badge{font-family:var(--font-m);font-size:10px;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;letter-spacing:.02em;}
.mode-badge .r{width:6px;height:6px;border-radius:50%;}
.mode-badge.cloud{background:rgba(47,158,91,.12);color:var(--green);}
.mode-badge.cloud .r{background:var(--green);box-shadow:0 0 6px var(--green);}
.mode-badge.local{background:rgba(185,121,28,.12);color:var(--amber);}
.mode-badge.local .r{background:var(--amber);}
.mode-badge.memory{background:rgba(214,69,69,.12);color:var(--red);}
.mode-badge.memory .r{background:var(--red);}
.login-mode-row{display:flex;justify-content:center;margin-bottom:14px;}

/* ===== Top bar ===== */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  padding:10px 16px;background:linear-gradient(180deg,#FFFFFF,#F7F9FB);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(31,41,55,.04);}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo-sm{width:30px;height:auto;flex:none;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.brand h1{font-family:var(--font-d);font-weight:700;letter-spacing:.06em;font-size:16px;margin:0;text-transform:uppercase;color:var(--ink);}
.brand .sub{font-size:9.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;font-family:var(--font-m);}
.mode-switch{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap;}
.mode-switch button{border:none;background:transparent;color:var(--ink-dim);font-family:var(--font-d);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:11.5px;padding:7px 12px;border-radius:6px;transition:.15s;}
.mode-switch button.active{background:var(--steel-dim);color:#fff;}
.user-chip{display:flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:11px;color:var(--ink-dim);flex-wrap:wrap;}
.user-chip .role{padding:2px 8px;border-radius:20px;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;}
.role-superadmin{background:rgba(156,127,224,.15);color:var(--purple);}
.role-field{background:rgba(79,163,196,.15);color:var(--steel);}
.role-hq{background:rgba(67,190,126,.15);color:var(--green);}
.role-finance{background:rgba(232,163,61,.15);color:var(--amber);}
.logout-btn{background:transparent;border:1px solid var(--line);color:var(--ink-dim);border-radius:6px;padding:5px 10px;font-size:11px;font-family:var(--font-m);}

/* ===== layout ===== */
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 60px;}
.grid{display:grid;gap:12px;}
.g-kpi{grid-template-columns:repeat(4,1fr);}
.g-2{grid-template-columns:1.3fr 1fr;}
.g-1{grid-template-columns:1fr;}
@media(max-width:860px){.g-kpi{grid-template-columns:repeat(2,1fr);}.g-2{grid-template-columns:1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap;gap:6px;}
.panel-h h2{font-family:var(--font-d);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0;font-weight:700;}
.panel-h .tag{font-family:var(--font-m);font-size:10px;color:var(--ink-faint);}
.panel-body{padding:14px;}
.kpi{padding:14px;}
.kpi .lbl{font-family:var(--font-d);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);}
.kpi .val{font-family:var(--font-m);font-size:24px;font-weight:600;margin-top:4px;}
.kpi .val small{font-size:12px;color:var(--ink-faint);font-weight:400;}
.delta{font-family:var(--font-m);font-size:11px;margin-top:6px;display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;}
.delta.ok{background:rgba(67,190,126,.12);color:var(--green);}
.delta.bad{background:rgba(225,82,82,.12);color:var(--red);}
.delta.warn{background:rgba(232,163,61,.12);color:var(--amber);}
.gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:6px 14px 16px;}
.gauge-num{font-family:var(--font-m);font-size:30px;font-weight:700;margin-top:-42px;}
.gauge-cap{font-family:var(--font-d);font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;text-align:center;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-family:var(--font-d);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:7px 8px;border-bottom:1px solid #EDF1F4;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
td.num,th.num{font-family:var(--font-m);text-align:right;}
td.wrap,th.wrap{white-space:normal;}
.badge{font-family:var(--font-m);font-size:10px;padding:2px 8px;border-radius:20px;display:inline-block;}
.badge.ok{background:rgba(67,190,126,.14);color:var(--green);}
.badge.bad{background:rgba(225,82,82,.14);color:var(--red);}
.badge.warn{background:rgba(232,163,61,.14);color:var(--amber);}
.badge.idle{background:rgba(139,152,163,.14);color:var(--ink-dim);}
.badge.urgent{background:rgba(214,69,69,.75);color:#fff;border:1px solid var(--red);animation:blinkbg 1.6s infinite;}
.badge.code{background:rgba(79,163,196,.16);color:var(--steel);border:1px solid rgba(79,163,196,.35);font-weight:600;}
@keyframes blinkbg{0%,100%{background:rgba(214,69,69,.75)}50%{background:rgba(214,69,69,1)}}
.scrollx{overflow-x:auto;}
.pbar{height:7px;background:#F7F9FB;border-radius:20px;overflow:hidden;border:1px solid var(--line);}
.pbar>div{height:100%;border-radius:20px;}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-family:var(--font-d);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);}
.field input,.field select,.field textarea{background:#F7F9FB;border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:8px 10px;font-size:13px;outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--steel);}
.field.span2{grid-column:1/-1;}
.checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-dim);}
.checkbox-group{display:flex;gap:14px;flex-wrap:wrap;padding:8px 10px;background:#F7F9FB;border:1px solid var(--line);border-radius:6px;}
.checkbox-group label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);cursor:pointer;}
.btn{font-family:var(--font-d);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12px;padding:9px 16px;border-radius:7px;border:1px solid var(--steel-dim);background:var(--steel-dim);color:#fff;}
.btn:hover{filter:brightness(1.15);}
.btn.ghost{background:transparent;color:var(--steel);}
.btn.green{background:var(--green);border-color:var(--green);color:#08150E;}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#231600;}
.btn.sm{padding:5px 10px;font-size:10.5px;}
.btn:disabled{opacity:.5;cursor:default;}
.well-input-grid{display:grid;grid-template-columns:70px 1fr 110px;gap:6px 10px;align-items:center;}
.well-input-grid .hd{font-family:var(--font-d);font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px;}
.well-input-grid input{width:100%;background:#F7F9FB;border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:7px 8px;font-family:var(--font-m);font-size:13px;}
.well-tgt{font-family:var(--font-m);color:var(--ink-faint);font-size:12px;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1F2937;border:1px solid var(--steel);color:#fff;padding:9px 18px;border-radius:8px;font-size:12.5px;font-family:var(--font-m);z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(31,41,55,.25);}
.toast.show{opacity:1;}
.toast.err{border-color:var(--red);}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);font-family:var(--font-d);text-transform:uppercase;letter-spacing:.05em;font-size:12px;font-weight:700;padding:8px 14px;border-radius:7px;}
.tabs button.active{background:var(--steel-dim);border-color:var(--steel-dim);color:#fff;}
.empty{color:var(--ink-faint);font-size:12.5px;padding:18px;text-align:center;font-family:var(--font-m);}
.footnote{font-size:10.5px;color:var(--ink-faint);font-family:var(--font-m);margin-top:10px;line-height:1.5;}
.alert-banner{display:flex;gap:10px;align-items:flex-start;background:rgba(214,69,69,.08);border:1px solid rgba(214,69,69,.35);color:#8C2E2E;padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:10px;}
.alert-banner.warn{background:rgba(185,121,28,.08);border-color:rgba(185,121,28,.35);color:#7A5210;}
.alert-banner.info{background:rgba(46,117,182,.08);border-color:rgba(46,117,182,.35);color:#1F5D8F;}
canvas{max-width:100%;}
.section-title{font-family:var(--font-d);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);margin:18px 0 8px;padding-top:6px;border-top:1px solid var(--line);}
.hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.req-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#F7FAFC;}
.req-card.urgent{border-color:var(--red);}
.req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;}
.req-top .item{font-weight:600;font-size:13px;}
.req-meta{font-family:var(--font-m);font-size:11px;color:var(--ink-faint);margin-top:2px;}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;}
.approve-box{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:none;}
.approve-box.open{display:block;}
.imgprev{max-width:140px;max-height:140px;border-radius:8px;border:1px solid var(--line);margin-top:6px;display:block;}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:300;}
.lightbox img{max-width:92vw;max-height:92vh;border-radius:8px;}
.usertable-actions{display:flex;gap:6px;flex-wrap:wrap;}
.code-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #EDF1F4;}
.code-row input{width:70px;}
</style>
</head>

<div id="root"><div class="empty" style="padding:60px 20px;">Memuat…</div></div>
<div class="toast" id="toast"></div>

/* ================= STORAGE (cloud → local → memory fallback) ================= */
let STORAGE_MODE = 'cloud';
let STORAGE_OK = true;
const MEMORY_DB = {};
function hasCloud(){ return typeof window!=='undefined' && !!window.storage; }
function tryLocalStorage(){
  try{
    const t='__tempino_probe__';
    window.localStorage.setItem(t,'1');
    window.localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
STORAGE_MODE = hasCloud() ? 'cloud' : (tryLocalStorage() ? 'local' : 'memory');

function modeLabel(){
  return STORAGE_MODE==='cloud' ? 'Realtime (Cloud)' : STORAGE_MODE==='local' ? 'Simulasi Lokal (perangkat ini)' : 'Simulasi Sementara (tab ini saja)';
}
function modeBadgeHTML(){
  const cls = STORAGE_MODE==='cloud' ? 'cloud' : STORAGE_MODE==='local' ? 'local' : 'memory';
  return `<span class="mode-badge ${cls}"><span class="r"></span>${modeLabel()}</span>`;
}
async function sGet(key, fallback){
  if(STORAGE_MODE==='cloud'){
    try{
      const r = await window.storage.get(key, true);
      STORAGE_OK = true;
      if(!r || r.value===undefined) return fallback;
      return JSON.parse(r.value);
    }catch(e){
      if(String(e.message||e).toLowerCase().includes('not found')) return fallback;
      console.warn('Cloud storage tidak tersedia, beralih ke simulasi:', e);
      STORAGE_MODE = tryLocalStorage() ? 'local' : 'memory';
    }
  }
  if(STORAGE_MODE==='local'){
    try{
      const raw = window.localStorage.getItem('tempino_sim::'+key);
      STORAGE_OK = true;
      return raw===null ? fallback : JSON.parse(raw);
    }catch(e){ STORAGE_MODE='memory'; }
  }
  STORAGE_OK = true;
  return (key in MEMORY_DB) ? JSON.parse(JSON.stringify(MEMORY_DB[key])) : fallback;
}
async function sSet(key, value){
  if(STORAGE_MODE==='cloud'){
    try{
      await window.storage.set(key, JSON.stringify(value), true);
      STORAGE_OK = true;
      return true;
    }catch(e){
      console.warn('Cloud storage gagal saat menyimpan, beralih ke simulasi:', e);
      STORAGE_MODE = tryLocalStorage() ? 'local' : 'memory';
      showToast('Cloud tidak tersedia — data disimpan pada mode simulasi ('+modeLabel()+').', true);
    }
  }
  if(STORAGE_MODE==='local'){
    try{
      window.localStorage.setItem('tempino_sim::'+key, JSON.stringify(value));
      STORAGE_OK = true;
      return true;
    }catch(e){ STORAGE_MODE='memory'; }
  }
  MEMORY_DB[key] = JSON.parse(JSON.stringify(value));
  STORAGE_OK = true;
  return true;
}

/* ================= IMAGE COMPRESSION ================= */
function fileToCompressedDataURL(file, maxW){
  return new Promise((resolve,reject)=>{
    if(!file){ resolve(null); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, (maxW||700)/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.55));
      };
      img.onerror = ()=>reject(new Error('gagal memuat gambar'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('gagal membaca file'));
    reader.readAsDataURL(file);
  });
}

/* ================= CSV DOWNLOAD ================= */
function downloadCSV(filename, rows){
  const csv = rows.map(r=> r.map(c=>'"'+String(c===undefined||c===null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function computeLabaRugi(month){
  const rev = state.production.filter(p=>p.date.slice(0,7)===month).reduce((s,p)=>s+Number(p.actualBOPD||0),0) * state.config.oilPriceIDR * 0.7;
  const opex = state.finance.filter(f=>f.type==='Cash Out' && f.category==='OPEX' && f.date.slice(0,7)===month).reduce((s,f)=>s+Number(f.amount||0),0);
  const capex = state.finance.filter(f=>f.type==='Cash Out' && f.category==='CAPEX' && f.date.slice(0,7)===month).reduce((s,f)=>s+Number(f.amount||0),0);
  return {rev, opex, capex, laba: rev-opex};
}
function computeNeraca(uptoMonth){
  const upTo = f => f.date.slice(0,7) <= uptoMonth;
  const cashIn = state.finance.filter(f=>f.type==='Cash In' && upTo(f)).reduce((s,f)=>s+Number(f.amount||0),0);
  const cashOutTotal = state.finance.filter(f=>f.type==='Cash Out' && upTo(f)).reduce((s,f)=>s+Number(f.amount||0),0);
  const cashOutCapex = state.finance.filter(f=>f.type==='Cash Out' && f.category==='CAPEX' && upTo(f)).reduce((s,f)=>s+Number(f.amount||0),0);
  const kas = state.config.cashAccountInitial + cashIn - cashOutTotal;
  const asetTetap = cashOutCapex;
  const totalAset = kas + asetTetap;
  const linkedIds = new Set(state.finance.filter(f=>f.linkedRequestId).map(f=>f.linkedRequestId));
  const liabilitas = state.requests.filter(r=>r.status==='Disetujui' && !linkedIds.has(r.id)).reduce((s,r)=>s+Number(r.estTotal||0),0);
  const equitas = totalAset - liabilitas;
  return {kas, asetTetap, totalAset, liabilitas, equitas};
}

function attachRequestFormHandlers(originRole){
  const p = 'rq_'+originRole+'_';
  const uEl=document.getElementById(p+'urgent');
  if(uEl) uEl.onchange=()=>{ document.getElementById(p+'deadline-wrap').style.display = uEl.value==='1'?'flex':'none'; };
  const needEl=document.getElementById(p+'need');
  if(needEl) needEl.onchange=()=>{ document.getElementById(p+'codeprev').textContent = ORIGIN_CODE[originRole]+'-'+needEl.value; };
  const btn=document.querySelector(`[data-submitreq="${originRole}"]`);
  if(btn) btn.onclick=async ()=>{
    const item=document.getElementById(p+'item').value;
    if(!item){ showToast('Isi nama item dahulu',true); return; }
    const qty=Number(document.getElementById(p+'qty').value||0);
    const price=Number(document.getElementById(p+'price').value||0);
    const urgent=document.getElementById(p+'urgent').value==='1';
    const needCode=Number(document.getElementById(p+'need').value);
    const entry={id:uid(),date:document.getElementById(p+'date').value,category:document.getElementById(p+'cat').value,
      item,qty,estUnitPrice:price,estTotal:qty*price,vendor:document.getElementById(p+'vendor').value,
      urgent, urgentDeadline: urgent? document.getElementById(p+'deadline').value : null,
      notes:document.getElementById(p+'notes').value, status:'Diajukan', approver:null, approvalNote:null, approvalTs:null,
      originRole, needCode, needLabel:needLabelFor(needCode),
      submittedBy:state.currentUser.username, submittedRole:originRole, ts:Date.now()};
    btn.disabled=true;
    const list=[...state.requests,entry]; const ok=await sSet('requests-log',list);
    if(ok){ state.requests=list; showToast(`Permintaan ${reqCode(entry)} terkirim ke Finance`); }
    btn.disabled=false; renderRoot();
  };
}

function hqViewHTML(){
  const date = state._hqDate || todayStr();
  const today = actualTotalForDate(date);
  const tgt = targetTotalBOPD();
  const pct = tgt>0 ? (today.sum/tgt*100) : 0;
  const pctClamped = Math.max(0,Math.min(100,pct));
  const month = monthStr(date);
  const mt = monthTotals(month);
  const bud = budgetFor(month);
  const capPct = bud.capex>0 ? (mt.cap/bud.capex*100) : 0;
  const opxPct = bud.opex>0 ? (mt.opx/bud.opex*100) : 0;
  const openMaint = state.maintenance.filter(m=>m.status!=='Selesai').length;
  const cash = cashSummary();
  const pend = pendingRequests();
  const urg = urgentPending();

  const alerts=[];
  if(today.reported<today.total) alerts.push({t:'warn',text:`Baru ${today.reported}/${today.total} sumur melapor produksi untuk ${date}.`});
  if(tgt>0 && pct<90 && today.reported>0) alerts.push({t:'bad',text:`Produksi hari ini ${pct.toFixed(1)}% dari target — di bawah ambang 90%.`});
  if(bud.capex>0 && capPct>100) alerts.push({t:'bad',text:`Realisasi CAPEX bulan ${month} melebihi budget (${capPct.toFixed(0)}%).`});
  if(urg.length>0) alerts.push({t:'bad',text:`${urg.length} permintaan URGENT dari Field/HQ sedang menunggu tindak lanjut Finance.`});

  const wells = activeWells();
  const map = prodForDate(date);
  const wellRows = wells.map(w=>{
    const rep = map[w.id]; const actual = rep? Number(rep.actualBOPD):null;
    const p = actual===null? null : (w.targetBOPD>0? actual/w.targetBOPD*100:100);
    let bd = actual===null? {c:'idle',t:'Belum lapor'} : p>=95? {c:'ok',t:'Tercapai'} : p>=80? {c:'warn',t:'Mendekati'} : {c:'bad',t:'Di bawah target'};
    return `<tr><td>${w.name}</td><td class="num">${fmtNum(w.targetBOPD,2)}</td><td class="num">${actual===null?'—':fmtNum(actual,2)}</td><td class="num">${p===null?'—':p.toFixed(0)+'%'}</td><td><span class="badge ${bd.c}">${bd.t}</span></td></tr>`;
  }).join('');

  const maintRows = [...state.maintenance].sort((a,b)=>b.ts-a.ts).slice(0,10).map(m=>
    `<tr><td>${m.date}</td><td>${wellName(m.wellId)}</td><td>${m.type}</td><td>${badge(m.status)}</td><td class="num">${fmtIDR(m.cost)}</td><td>${m.vendor||'—'}</td></tr>`

      <span class="delta ${opxPct>100?'bad':opxPct>85?'warn':'ok'}">${opxPct.toFixed(0)}% terpakai</span></div>
    <div class="panel kpi"><div class="lbl">Saldo Kas Proyek</div><div class="val" style="font-size:19px;">${fmtIDR(cash.balance)}</div>

/* ================= GAUGE / CHARTS ================= */
function gaugeSVG(pct){
  const r=70, cx=90, cy=90;
  function pt(a,rad){ const rd=(a*Math.PI)/180; return [cx+rad*Math.cos(rd), cy+rad*Math.sin(rd)]; }
  const angle = 180 + (pct/100)*180;
  const [x1,y1]=pt(180,r), [x2,y2]=pt(360,r);
  const color = pct>=95?'#43BE7E':pct>=80?'#E8A33D':'#E15252';
  const largeArc = (angle-180)>180?1:0;
  const [ax,ay]=pt(180,r), [bx,by]=pt(angle,r);
  return `<svg width="180" height="100" viewBox="0 0 180 100">
    <path d="M ${x1} ${y1} A ${r} ${r} 0 1 1 ${x2} ${y2}" fill="none" stroke="#E4EAEF" stroke-width="14" stroke-linecap="round"/>
    <path d="M ${ax} ${ay} A ${r} ${r} 0 ${largeArc} 1 ${bx} ${by}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"/>
    <circle cx="${bx}" cy="${by}" r="5" fill="#fff"/>
  </svg>`;
}
function drawHQChart(){
  const canvas=document.getElementById('trend-chart'); if(!canvas) return;
  const dates=last14Dates(); const tgt=targetTotalBOPD();
  const actualData=dates.map(d=>{ const a=actualTotalForDate(d); return a.reported>0? Number(a.sum.toFixed(2)):null; });
  const targetData=dates.map(()=>tgt);
  if(state.chart) state.chart.destroy();
  state.chart = new Chart(canvas.getContext('2d'),{type:'line',
    data:{labels:dates.map(d=>d.slice(5)),datasets:[
      {label:'Aktual',data:actualData,borderColor:'#4FA3C4',backgroundColor:'rgba(79,163,196,.15)',tension:.3,spanGaps:true,pointRadius:3,fill:true},
      {label:'Target',data:targetData,borderColor:'#E8A33D',borderDash:[5,4],pointRadius:0,tension:0}]},
    options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{color:'#8B98A3',font:{size:11}}}},
      scales:{x:{ticks:{color:'#8B98A3',font:{size:10}},grid:{color:'#E9EEF2'}},y:{ticks:{color:'#8B98A3',font:{size:10}},grid:{color:'#E9EEF2'},beginAtZero:true}}}});
}
function drawFinanceChart(){
  const canvas=document.getElementById('finance-chart'); if(!canvas) return;
  const dates=last14Dates();
  const cashIn=dates.map(d=>state.finance.filter(f=>f.type==='Cash In'&&f.date===d).reduce((s,f)=>s+Number(f.amount||0),0));
  const cashOut=dates.map(d=>state.finance.filter(f=>f.type==='Cash Out'&&f.date===d).reduce((s,f)=>s+Number(f.amount||0),0));
  if(state.chart2) state.chart2.destroy();
  state.chart2 = new Chart(canvas.getContext('2d'),{type:'bar',
    data:{labels:dates.map(d=>d.slice(5)),datasets:[
      {label:'Kas Masuk',data:cashIn,backgroundColor:'rgba(67,190,126,.65)'},
      {label:'Kas Keluar',data:cashOut,backgroundColor:'rgba(225,82,82,.65)'}]},
    options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{color:'#8B98A3',font:{size:11}}}},
      scales:{x:{ticks:{color:'#8B98A3',font:{size:10}},grid:{color:'#E9EEF2'}},y:{ticks:{color:'#8B98A3',font:{size:10}},grid:{color:'#E9EEF2'},beginAtZero:true}}}});
}

      state._proofData = dataUrl;

    const note=document.getElementById('f-note').value;
    if(!desc||amount<=0){ showToast('Lengkapi deskripsi dan jumlah',true); return; }
    if(type==='Cash Out' && !note){ showToast('Catatan approval wajib untuk Cash Out',true); return; }
    saveF.disabled=true;
    const linkedEl=document.getElementById('f-linked');
    const entry={id:uid(),date:document.getElementById('f-date').value,type,
      category:document.getElementById('f-cat').value,amount,description:desc,
      approver:state.currentUser.username,approvalNote:note||null,
      proof: state._proofData || null, linkedRequestId: (linkedEl&&linkedEl.value)||null,
      recordedBy:state.currentUser.username, ts:Date.now()};
    const list=[...state.finance,entry]; const ok=await sSet('finance-log',list);
    if(ok){ state.finance=list; state._proofData=null; showToast(type+' tersimpan'); }
    saveF.disabled=false; renderRoot();
  };
  const monthEl=document.getElementById('rep-month');
  if(monthEl) monthEl.onchange=()=>{ state._finReportMonth=monthEl.value; renderRoot(); };
  const dlLR=document.getElementById('dl-lr'); if(dlLR) dlLR.onclick=()=>downloadLabaRugi(state._finReportMonth||monthStr(todayStr()));
  const dlNC=document.getElementById('dl-neraca'); if(dlNC) dlNC.onclick=()=>downloadNeraca(state._finReportMonth||monthStr(todayStr()));
  attachLightbox();
}

function attachUsersHandlers(){
  const createBtn=document.getElementById('create-user');
  if(createBtn) createBtn.onclick=async ()=>{
    const name=document.getElementById('nu-name').value.trim();
    const username=document.getElementById('nu-user').value.trim();
    const password=document.getElementById('nu-pass').value;
    const roles=[...document.querySelectorAll('.nu-role:checked')].map(c=>c.value);
    if(!name||!username||!password){ showToast('Lengkapi semua field',true); return; }
    if(!roles.length){ showToast('Pilih minimal satu role',true); return; }
    if(state.users.some(u=>u.username===username)){ showToast('Username sudah dipakai',true); return; }
    createBtn.disabled=true;
    const list=[...state.users,{id:uid(),username,password,name,roles,active:true}];
    const ok=await sSet('users',list);
    if(ok){ state.users=list; showToast('User dibuat'); }
    createBtn.disabled=false; renderRoot();
  };
  document.querySelectorAll('.tgl-user').forEach(b=>{
    b.onclick=async ()=>{
      const list=state.users.map(u=>u.id===b.dataset.id?{...u,active:!u.active}:u);
      const ok=await sSet('users',list); if(ok){ state.users=list; showToast('Status user diperbarui'); } renderRoot();
    };
  });
  document.querySelectorAll('.reset-user').forEach(b=>{
    b.onclick=()=>{
      const row=document.getElementById('reset-row-'+b.dataset.id);
      if(row) row.style.display = row.style.display==='none' ? 'table-row' : 'none';
    };
  });
  document.querySelectorAll('[data-cancel-reset]').forEach(b=>{
    b.onclick=()=>{ const row=document.getElementById('reset-row-'+b.dataset.cancelReset); if(row) row.style.display='none'; };
  });
  document.querySelectorAll('[data-confirm-reset]').forEach(b=>{
    b.onclick=async ()=>{
      const id=b.dataset.confirmReset;
      const np=document.getElementById('np-'+id).value;
      if(!np){ showToast('Isi password baru dahulu',true); return; }
      b.disabled=true;
      const list=state.users.map(u=>u.id===id?{...u,password:np}:u);
      const ok=await sSet('users',list);
      if(ok){ state.users=list; showToast('Password direset'); }
      b.disabled=false; renderRoot();
    };
  });
  document.querySelectorAll('.edit-role-user').forEach(b=>{
    b.onclick=()=>{
      const row=document.getElementById('editrole-row-'+b.dataset.id);
      if(row) row.style.display = row.style.display==='none' ? 'table-row' : 'none';
    };
  });
  document.querySelectorAll('[data-cancel-role]').forEach(b=>{
    b.onclick=()=>{ const row=document.getElementById('editrole-row-'+b.dataset.cancelRole); if(row) row.style.display='none'; };
  });
  document.querySelectorAll('[data-confirm-role]').forEach(b=>{
    b.onclick=async ()=>{
      const id=b.dataset.confirmRole;
      const roles=[...document.querySelectorAll('.er-'+id+'-role:checked')].map(c=>c.value);
      if(!roles.length){ showToast('Pilih minimal satu role',true); return; }
      if(id===state.currentUser.id && !roles.includes('superadmin')){ showToast('Tidak bisa menghapus role Super Admin dari akun sendiri',true); return; }
      b.disabled=true;
      const list=state.users.map(u=>u.id===id?{...u,roles}:u);
      const ok=await sSet('users',list);
      if(ok){ state.users=list; showToast('Role diperbarui'); }
      b.disabled=false; renderRoot();
    };
  });
  document.querySelectorAll('.save-code').forEach(b=>{
    b.onclick=async ()=>{
      const row=document.querySelector(`.code-row[data-codeid="${b.dataset.code}"]`);
      const newLabel=row.querySelector('.code-label').value.trim();
      if(!newLabel){ showToast('Label tidak boleh kosong',true); return; }
      const cfg={...state.config, needCodes: state.config.needCodes.map(n=> n.code===Number(b.dataset.code) ? {...n,label:newLabel} : n)};
      const ok=await sSet('config',cfg);
      if(ok){ state.config=cfg; showToast('Kode kebutuhan diperbarui'); }
      renderRoot();
    };
  });
  document.querySelectorAll('.del-code').forEach(b=>{
    b.onclick=async ()=>{
      const cfg={...state.config, needCodes: state.config.needCodes.filter(n=> n.code!==Number(b.dataset.code))};
      const ok=await sSet('config',cfg);
      if(ok){ state.config=cfg; showToast('Kode kebutuhan dihapus'); }
      renderRoot();
    };
  });
  const addCodeBtn=document.getElementById('add-code');
  if(addCodeBtn) addCodeBtn.onclick=async ()=>{
    const num=Number(document.getElementById('new-code-num').value);
    const label=document.getElementById('new-code-label').value.trim();
    if(!num||!label){ showToast('Isi nomor dan label kode',true); return; }
    if(state.config.needCodes.some(n=>n.code===num)){ showToast('Kode sudah ada',true); return; }
    const cfg={...state.config, needCodes:[...state.config.needCodes,{code:num,label}].sort((a,b)=>a.code-b.code)};
    const ok=await sSet('config',cfg);
    if(ok){ state.config=cfg; showToast('Kode kebutuhan ditambahkan'); }
    renderRoot();
  };
}

/* ================= INIT ================= */
boot();
</script>
